    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(90deg, #2B0031, #6A0DAD, #000000);
            min-height: 100vh;
            color: #fff;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header__logo {
            color: #fff;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header__logo i {
            color: #C5161D;
        }

        .header__actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .header__actions i {
            font-size: 1.5rem;
            cursor: pointer;
        }

        .main {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .player-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 2rem;
            position: relative;
        }

        .video-player {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            position: relative;
        }

        .player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            padding: 1rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .control-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 1.5rem;
        }

        .quality-selector {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 0.5rem;
            border-radius: 5px;
        }

        .match-info {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .match-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .match-status {
            background: #C5161D;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
        }

        .match-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .detail-item i {
            color: #C5161D;
        }

        .related-streams {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 1.5rem;
        }

        .section-title {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stream-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
        }

        .stream-card {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .stream-card:hover {
            transform: translateY(-5px);
        }

        .stream-thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
        }

        .stream-info {
            padding: 1rem;
        }

        .stream-title {
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .stream-meta {
            font-size: 0.875rem;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        @media (max-width: 768px) {
            .main {
                padding: 1rem;
            }

            .match-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    <!-- Thêm thư viện HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        const video = document.getElementById('video');
        // Link m3u8 của bạn
        const videoSrc = 'https://fox-foxnewsnow-samsungus.amagi.tv/playlist720p.m3u8';

        // Nếu trình duyệt hỗ trợ HLS thông qua HLS.js
        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function () {
                video.play();
            });
        }
        // Nếu trình duyệt hỗ trợ HLS natively (ví dụ: Safari)
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function () {
                video.play();
            });
        } else {
            console.error('Trình duyệt của bạn không hỗ trợ HLS.');
        }
    </script>

        });

        document.addEventListener('DOMContentLoaded', function () {
            initializeDetail();
        });


        function initializeDetail() {
            // Lấy ID từ URL
            const urlParams = new URLSearchParams(window.location.search);
            const showId = urlParams.get('id');

            if (!showId) {
                window.location.href = 'index.html';
                return;
            }

            // Lấy data từ localStorage
            const showData = JSON.parse(localStorage.getItem('currentShow'));

            if (!showData || showData.id !== showId) {
                window.location.href = 'index.html';
                return;
            }

            // Cập nhật UI với data
            updateDetailUI(showData);
        }

        function updateDetailUI(show) {
            // Cập nhật tiêu đề
            document.querySelector('.match-title span:first-child').textContent = show.title;

            // Cập nhật video thumbnail
            document.querySelector('.video-player img').src = show.thumbnail;

            // Cập nhật thông tin
            document.querySelector('.mvici-left p:nth-child(1) span').textContent =
                new Intl.NumberFormat().format(show.views);
            document.querySelector('.mvici-left p:nth-child(2) span').textContent =
                show.broadcaster;

            // Cập nhật embed code và VLC link
            document.querySelectorAll('.copy-input input')[0].value = show.embedCode;
            document.querySelectorAll('.copy-input input')[1].value = show.vlcLink;

            // Cập nhật related streams (có thể random từ danh sách có sẵn)
            updateRelatedStreams(show);
